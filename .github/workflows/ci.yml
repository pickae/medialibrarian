name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  default-suite:
    # Not ubuntu-latest: setup-python only has the builds actions/python-versions
    # published for each image, and 3.11.4 - the floor below - was never built
    # for 26.04, which ubuntu-latest became. 24.04 is the newest image that has it.
    runs-on: ubuntu-24.04
    # Well clear of the ~4.5 minutes this job takes, and far under the 6 HOURS
    # GitHub allows a step by default. A suite this full of child processes can
    # wait on one that never returns, and the default turns that into a runner
    # held all day rather than a red job somebody reads.
    timeout-minutes: 20
    # Both ends of the range pyproject.toml declares, because only the ends can
    # differ: a call that arrived after the floor passes on the newer one and
    # fails on the older, and nobody would find out. 3.11.4 exactly, rather than
    # "3.11", because the floor is where it is for a reason - extractall learned
    # the filter the archive extraction depends on in that release - and a job on
    # 3.11.9 would not stand on it.
    #
    # 3.14 as well, for a difference that is not in the language: it is the
    # first release whose multiprocessing starts workers by forkserver rather
    # than fork on Linux, so a worker no longer inherits what the parent put in
    # os.environ after the fork server started. 3.11 and 3.12 cannot see a bug
    # of that kind, and the machine the commands run on is on 3.14.
    #
    # A matrix rather than a job of its own: the tiers below need real tools
    # (ffmpeg, duckdb), so a separate job would be this one's whole setup
    # written out twice and free to drift from it.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.4", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # The tools the suite reaches for on the HOST rather than through a stub:
      # the cases that build a PATH out of real binaries (`zip`, `tree`,
      # `rsync`, `jq`, `duckdb`), and the commands' own preflight, which refuses
      # to start when one of the tools it names is missing. Without these the
      # job only exercises the tool-free cases and reports green for a fraction
      # of the suite.
      #
      # The archive, PDF and e-book tools (`p7zip`, `unrar`, `poppler-utils`,
      # `ghostscript`, Calibre) are absent on purpose: they are stubbed at this
      # tier, and only the opt-in `media` tier reaches the real ones.
      #
      # The .debs come out of the Actions cache rather than the runner's Ubuntu
      # mirror. That mirror is sometimes slow enough that fetching these 72 MB
      # takes longer than the whole job is allowed, and the run then gets
      # cancelled in apt with no tests run, even though the same fetch usually
      # takes seconds. The key changes weekly, so apt downloads only what was
      # updated since, and `autoclean` removes the versions that were replaced.
      - name: key the apt cache
        id: apt-key
        run: |
          packages="ffmpeg mkvtoolnix imagemagick mediainfo fdupes beets jq rsync tree zip unzip"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "key=apt-ubuntu-24.04-$(echo "$packages" | sha256sum | cut -c1-12)-$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-ubuntu-24.04-
      - name: install the external tools
        # A cold cache on a slow mirror still has to get through apt; this makes
        # that fail as a step that says so, not as a cancelled job.
        timeout-minutes: 12
        run: |
          mkdir -p ~/apt-archives/partial
          apt_opts="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=3"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends $apt_opts \
            ${{ steps.apt-key.outputs.packages }}
          sudo apt-get autoclean $apt_opts
          # apt leaves its lock and partial/ owned by root, which the cache
          # cannot read back at the end of the job.
          sudo rm -rf ~/apt-archives/lock ~/apt-archives/partial
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # duckdb has no apt package - the release is one gzipped ELF binary.
      # PINNED, because the census hypercubes are built by real SQL and a
      # version is a dialect: an unpinned CLI turns a syntax change upstream
      # into a red suite here.
      - name: install the duckdb CLI
        run: |
          curl -fsSL -o duckdb.gz \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.gz
          sha256sum duckdb.gz
          gunzip duckdb.gz
          chmod +x duckdb
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version

      # pytest-xdist because this suite is BUILT to run in parallel and was not
      # being asked to: tests/conftest.py gives every case a private place to
      # work and tests/test_self_containment.py fails one that writes to a
      # shared path, which is the whole cost of `-n` paid up front. Most of the
      # wall clock here is starting child processes - the ~1460 cases under
      # tests/cli each start a command - and that is the shape that parallelises
      # best.
      - run: pip install -e . pytest pytest-xdist
      - run: python -m pytest -n auto

  # The import canary: collecting the pure tier imports the whole package, so
  # a POSIX-only module-scope import fails here. The pure cases then run - the
  # tier is disk- and tool-free, so it holds on any platform.
  windows-pure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pytest-xdist
      - run: python -m pytest -m pure -n auto
      # And the scratch module on top of the pure tier: it drives the
      # filesystem directly rather than through coreutils, so its cases are
      # disk-only and hold here too - and it is the module Windows differs from
      # Linux in most (no RAM disk, no /proc, no ~/.cache), which is the reason
      # to gate it on the platform rather than to reason about it.
      # Serial, unlike the run above it: one file of disk-only cases is over
      # before `-n` has finished starting its workers.
      - run: python -m pytest tests/lib/test_ramscratch.py

  # macOS, whose support is aspirational: nobody's machine is behind it. The
  # job is the whole default suite, not a tier of it: a Mac IS a POSIX host, so
  # the stubbed tier's bash stubs and symlinks work there, and what is actually
  # being asked is whether the BSD-flavoured tooling underneath answers the same
  # as the GNU one - which is the only way to find out.
  #
  # Homebrew is where the tools come from, and the formula names differ from the
  # apt ones in three places: 7-Zip is "sevenzip" (and installs `7zz`, which the
  # `7z|7zz|7za` alternatives accept), `flock` is not packaged at all - the
  # progress counters use the C library's lock there instead - and `unrar` is
  # not in homebrew-core, so this job is one of the ones without it and the
  # cases that need it skip.
  #
  # rsync is installed rather than inherited: the bundled one is 2.6.9 and has
  # no `--out-format`. The command falls back to `--log-format` on its own, but
  # the job that would notice a REGRESSION in that fallback is one where the
  # modern flag is what gets used, so both spellings want a host - and this is
  # the one that has the old one to fall back FROM.
  macos:
    runs-on: macos-latest
    # Gating like the rest: a job that cannot fail is a job nobody reads.
    # This is also the job with a clock worth bounding: its first run spent 47
    # minutes in pytest against the same suite Linux finishes in four and a
    # half. It was slow rather than stuck - it did reach the end and report -
    # so the limit here is a runaway guard and NOT a target, and it is set well
    # above that 47 rather than just over it: the fixtures were missing on that
    # run, and a case that now does its work instead of failing on a absent
    # page can only take longer. A limit that trips on the ordinary duration
    # tells nobody anything, while still leaving a genuinely hung run held for
    # the 6 hours GitHub allows by default, on a runner billed at ten times a
    # Linux one.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the external tools
        run: |
          brew install --quiet ffmpeg mkvtoolnix imagemagick media-info \
            fdupes beets jq rsync tree zstd sevenzip duckdb

      - run: pip install -e . pytest pytest-xdist
      # `-n auto` matters most here: this is the host where starting a child
      # process is dearest, and starting them is most of what the suite does.
      #
      # `--durations` because a wall clock does not say WHERE the time went, and
      # this job's first run - 47 minutes, serial - could not tell a Mac that is
      # uniformly slower at spawning from one case sitting on a timeout. The
      # list names it, and `-n` does not blur it: a duration is measured per
      # case whichever worker ran it.
      - run: python -m pytest -n auto --durations=25

  # The type checker. pyproject.toml's mypy section says a module that stops
  # passing should fail the run rather than join a list nobody works down -
  # this is the run that makes that true.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . mypy
      - run: python -m mypy medialib tools

  # The linter, with the rules pyproject.toml selects. Configured there and
  # never run, it had drifted; this is the run that keeps it from drifting.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: a new ruff adds checks to the rules selected, and an unpinned one
      # would turn that into a red run on a change that touched nothing.
      - run: pip install ruff==0.16.5
      - run: ruff check .
