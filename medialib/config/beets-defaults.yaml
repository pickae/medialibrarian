# beets configuration for ingest-music's "beets" music layout
# -----------------------------------------------------------
# Picked with musicLayout=beets. Unlike the shipped beets.yaml, which tags the
# files where they lie, this one lets beets MOVE each matched album, and
# ingest-music does not clean the names afterwards. It names no paths of its
# own, so beets' defaults apply:
#
#     Artist/Album/01 Title.flac
#     Compilations/Album/01 Title.flac
#     Non-Album/Artist/Title.flac          (singleton)
#
# ingest-music runs this file as "beet -c <it> -d <ingestDir>", so the
# directory below is only a fallback. An album beets cannot match is skipped
# and stays where the download put it.

directory: .
library: ~/.cache/ingestMusic/beets.db

import:
    copy: no
    move: yes         # move each matched album to beets' default path
    write: yes        # write resolved tags back into the files
    resume: no
    incremental: no  # do not skip folders already imported on a re-run
    quiet_fallback: skip

# fromfilename: an album with poor tags is matched on its file names too.
# missing, duplicates and badfiles: ingest-music reads their reports after the
# import (albums missing tracks, albums held twice, files failing their check).
# mbsync: "beet -c <this file> mbsync" refreshes the tags from MusicBrainz.
# discogs is added at run time, and only when the discogsToken setting is set.
plugins: fetchart embedart lastgenre lyrics replaygain chroma fromfilename mbsync missing duplicates badfiles

fetchart:
    cautious: true
    cover_names: front back
    maxwidth: 2000

embedart:
    maxwidth: 1000

# The ffmpeg backend: the default "command" backend only runs mp3gain or
# aacgain, which skip every FLAC - and the library is FLAC.
replaygain:
    backend: ffmpeg

match:
    strong_rec_thresh: 0.10
